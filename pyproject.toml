[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resistoscan"
version = "0.1.0"
description = "Alignment-free screening of antimicrobial resistance genes in clinical isolates and environmental metagenomes (One Health)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "aespejolobo-rgb" }]
keywords = ["bioinformatics", "antimicrobial resistance", "metagenomics", "one health", "k-mer", "wastewater surveillance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
resistoscan = "resistoscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resistoscan = ["data/*.fasta", "data/*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
